<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#131314">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GPT CORE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gg" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse"><stop stop-color="#4285F4"/><stop offset=".5" stop-color="#9B72CB"/><stop offset="1" stop-color="#D96570"/></linearGradient>
</defs></svg>

<div id="app">
  <header class="top">
    <button class="ib" id="btnMenu" aria-label="Menu"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg></button>
    <button class="pill" id="modelPill" aria-label="Scegli API"><span id="pillText">Nessuna API</span><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></button>
    <button class="avatar" id="btnAvatar" aria-label="Impostazioni"><div id="avatarL">F</div></button>
  </header>

  <main id="main">
    <div id="hero">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 0C12 6.62742 6.62742 12 0 12C6.62742 12 12 17.3726 12 24C12 17.3726 17.3726 12 24 12C17.3726 12 12 6.62742 12 0Z" fill="url(#gg)"/></svg>
      <h1>Ciao, <b class="grad-t" id="heroName">Flubatir</b></h1>
      <p>Come posso aiutarti oggi?</p>
    </div>
    <div id="chat" class="hidden"></div>
    <div id="sugg">
      <div class="cap">Suggerimenti rapidi</div>
      <div class="hs">
        <button class="sc" data-p="Scrivi e analizza del codice in Python per ordinare una lista"><p>Scrivi o analizza del codice</p><i style="color:#60a5fa"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"/></svg></i></button>
        <button class="sc" data-p="Dammi 5 idee creative per un progetto tecnologico originale"><p>Brainstorming e idee creative</p><i style="color:#c084fc"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 2.478a12.06 12.06 0 01-4.5 0m3.75 2.383a14.406 14.406 0 01-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 10-7.517 0c.85.493 1.509 1.333 1.509 2.316V18"/></svg></i></button>
        <button class="sc" data-p="Riepiloga in 3 punti i concetti chiave della fisica quantistica"><p>Riepiloga o traduci un testo</p><i style="color:#f472b6"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg></i></button>
        <button class="sc" data-p="Quali sono gli ultimi aggiornamenti per ottimizzare un PC da gaming?"><p>Consigli per giochi e tech</p><i style="color:#34d399"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 01-5.84 0M6.5 11a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm11 0a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM12 21a9 9 0 100-18 9 9 0 000 18z"/></svg></i></button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div id="chips"></div>
    <div class="bar">
      <button class="rb" id="btnPlus" aria-label="Allega"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg></button>
      <textarea id="inp" rows="1" placeholder="Chiedi a GPT CORE..." autocomplete="off" autocapitalize="sentences"></textarea>
      <div class="acts">
        <button class="ab2" id="btnMic" aria-label="Dettatura"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 003-3V4.5a3 3 0 10-6 0v8.25a3 3 0 003 3z"/></svg></button>
        <button class="ab2" id="btnCam" aria-label="Fotocamera"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0c-.684.039-1.314.42-1.736 1.039l-.821 1.316z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/></svg></button>
        <button class="send hidden" id="btnSend" aria-label="Invia"></button>
      </div>
    </div>
    <div class="disc">GPT CORE può mostrare informazioni non accurate.</div>
  </footer>

  <!-- menu modelli (tendina sotto il titolo) -->
  <div id="modelMenu" class="ov hidden"><div class="mm" id="mmCard"></div></div>

  <!-- allegati -->
  <div id="attach" class="ov dim hidden"><div class="sheet"><div class="grip"></div><h3>Aggiungi contenuto</h3>
    <div class="g3"><button data-k="gal"><span>🖼️</span>Galleria</button><button data-k="doc"><span>📁</span>Documenti</button></div>
  </div></div>

  <!-- menu a tre righe -->
  <div id="drawer" class="ov"><div class="dp">
    <div class="dh"><b class="grad-t">GPT CORE</b><button class="ib" id="dClose" style="padding:6px"><svg style="width:20px;height:20px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button></div>
    <button class="nb" id="dNew"><svg style="color:#60a5fa" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg><span>Nuova chat</span></button>
    <div class="dsec">Strumenti</div>
    <button class="di" id="dStore"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z"/></svg><span class="l">Store API</span></button>
    <button class="di" id="dMail"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg><span class="l">Mail</span></button>
    <div class="dsec">Recenti</div>
    <div id="recents"></div>
    <div class="dfoot"><button class="di" id="dSet"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.34 15.84c-.68 0-1.3-.3-1.7-.8L5.2 10.6c-.8-.98-.8-2.4 0-3.38l3.44-4.44c.4-.5 1.02-.8 1.7-.8h6.96c.68 0 1.3.3 1.7.8l3.44 4.44c.8.98.8 2.4 0 3.38l-3.44 4.44c-.4.5-1.02.8-1.7.8h-6.96z"/></svg><span class="l">Impostazioni</span></button></div>
  </div></div>

  <!-- schermate -->
  <section id="scrStore" class="screen"><div class="sh"><button class="ib" data-back="store"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button><h2 id="storeTitle">Store API</h2></div><div class="sb" id="storeBody"></div></section>
  <section id="scrMail" class="screen"><div class="sh"><button class="ib" data-back="mail"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button><h2>Mail</h2><div class="tabs"><button id="tabW" class="on">Scrivi</button><button id="tabH">Storico</button></div></div><div class="sb" id="mailBody"></div></section>
  <section id="scrSet" class="screen"><div class="sh"><button class="ib" data-back="set"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg></button><h2>Impostazioni</h2></div><div class="sb" id="setBody"></div></section>

  <div id="dlg" class="ov dim hidden"><div class="dlgc"><h3 id="dlgT"></h3><p id="dlgP"></p><div class="btns"><button class="btn" id="dlgNo">Annulla</button><button class="btn pri" id="dlgYes">OK</button></div></div></div>
  <div id="toast"></div>
</div>

<input type="file" id="fGal" accept="image/*" multiple hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fDoc" accept=".txt,.md,.py,.js,.ts,.json,.csv,.html,.css,.xml,.yml,.yaml,.ini,.log,.c,.cpp,.h,.java,.sh,.bat,text/*" multiple hidden>
<input type="file" id="fCfg" accept=".json,application/json" hidden>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
