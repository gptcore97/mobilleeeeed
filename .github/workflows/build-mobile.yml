name: Build APK e IPA

on:
  workflow_dispatch:        # Actions → Build APK e IPA → Run workflow
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm install
      - run: npm run www
      - run: npx cap add android
      - name: Icone (se fallisce restano quelle predefinite)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#131314' --iconBackgroundColorDark '#131314'
      - run: sh scripts/patch_android.sh
      - run: npx cap sync android

      - name: Firma (chiave tua) oppure debug
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          mkdir -p ../build
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease
            echo "$KS_B64" | base64 -d > ../build/release.jks
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../build/aligned.apk
            "$BT/apksigner" sign --ks ../build/release.jks --ks-pass "pass:$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:${KEY_PASS:-$KS_PASS}" --out ../build/GPT-CORE.apk ../build/aligned.apk
            rm -f ../build/release.jks ../build/aligned.apk
            echo "APK firmato con la tua chiave." >> "$GITHUB_STEP_SUMMARY"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../build/GPT-CORE.apk
            echo "APK firmato con la chiave di debug (cambia a ogni build: il login Google non funzionerà). Imposta i secret ANDROID_KEYSTORE_* per una firma stabile." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '### SHA-1 del certificato (da registrare in Google Cloud per il login Google)' >> "$GITHUB_STEP_SUMMARY"
          keytool -printcert -jarfile ../build/GPT-CORE.apk | grep -E 'SHA1|SHA-1' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-CORE-android-apk
          path: build/GPT-CORE.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }

      - run: npm install
      - run: npm run www
      - run: npx cap add ios
      - name: Icone (se fallisce restano quelle predefinite)
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#131314' --iconBackgroundColorDark '#131314'
      - run: sh scripts/patch_ios.sh
      - run: npx cap sync ios

      - name: Archivio senza firma
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Crea IPA non firmato
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../GPT-CORE-unsigned.ipa Payload)
          echo "IPA non firmato: va firmato (Sideloadly/AltStore con il tuo Apple ID, oppure con un account Apple Developer) prima di installarlo." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-CORE-ios-ipa-unsigned
          path: build/GPT-CORE-unsigned.ipa
